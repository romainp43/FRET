# Alternative à Caddy : nginx + certbot (certbot --nginx -d fret.example.fr, renouvellement via le timer certbot).
limit_req_zone $binary_remote_addr zone=fretrau:10m rate=10r/s;
server {
    listen 80;
    server_name fret.example.fr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name fret.example.fr;
    ssl_certificate     /etc/letsencrypt/live/fret.example.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fret.example.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 64k;
    location / {
        limit_req zone=fretrau burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # écrase toute valeur fournie par le client
        proxy_set_header X-Forwarded-Proto https;
    }
}
