<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FRETRAU — Administration</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top"><div class="wrap"><a class="brand" href="/">FRET<b>RAU</b></a><span class="badge">Administration</span></div></header>
  <main class="wrap">
    <section id="login" class="card">
      <h2>Connexion</h2>
      <form id="login-form">
        <label for="user">Identifiant</label>
        <input id="user" autocomplete="username" required>
        <label for="pw">Mot de passe administrateur</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <label for="totp">Code 2FA (si activé)</label>
        <input id="totp" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <button class="full" type="submit">Se connecter</button>
        <div id="login-error" class="err hidden" role="alert"></div>
      </form>
    </section>

    <section id="dash" class="hidden">
      <div class="tiles" id="tiles"></div>
      <h2>Réservations</h2>
      <table class="data"><thead><tr><th>#</th><th>Code</th><th>Trajet</th><th>Statut</th><th>Transporteur</th><th>Prix client HT</th><th>Achat HT</th></tr></thead><tbody id="rows"></tbody></table>
      <div id="detail" class="card hidden"></div>
      <div id="payables-box" class="hidden">
        <h2>Paiements transporteurs</h2>
        <p class="muted small" id="payables-total"></p>
        <table class="data"><tbody id="payables"></tbody></table>
      </div>
      <h2>E-mails sortants</h2>
      <table class="data"><tbody id="outbox"></tbody></table>
      <h2>Journal d'audit</h2>
      <table class="data"><tbody id="audit"></tbody></table>
    </section>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
